async function connectAd(b){const msg=$("#admsg"),ok=$("#adok");msg.textContent="";ok.innerHTML="";let sdk=$("#adsdk").value.trim(),zone=$("#adzone").value.trim();const raw=$("#adraw").value;if(raw.trim()){const s=raw.match(/src=['"]([^'"]+)['"]/),z=raw.match(/data-zone=['"](\d+)['"]/);if(s)sdk=s[1];if(z)zone=z[1]}if(!/^(https?:)?\/\/./.test(sdk)){msg.textContent="❌ SDK লিংক ঠিক নয় (// বা https:// দিয়ে শুরু হতে হবে)";return}if(!/^\d{4,}$/.test(zone)){msg.textContent="❌ Zone ID শুধু সংখ্যা হতে হবে";return}const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>কানেক্ট হচ্ছে...';try{await loadAdSdk(sdk,zone);AD=Object.assign({},AD,{sdk,zone});ZONE=zone;LS.set("dm_ad",AD);if(FB.ok)await saveSettings();$("#adsdk").value=sdk;$("#adzone").value=zone;ok.innerHTML=`<div class="okt" style="margin-top:12px">✔ কানেক্টেড — Zone ${esc(zone)}</div><button class="sm s" style="width:100%;padding:12px" onclick="testAd(this)">▶ টেস্ট অ্যাড দেখুন</button>`}catch(e){msg.textContent="❌ "+(e.message||e)}b.disabled=false;b.innerHTML=o}

let FSV=null;
function fsLayout(){const vb=FSV;if(!vb)return;const pv=vb.querySelector("video"),portrait=innerHeight>innerWidth,land=pv&&pv.videoWidth>pv.videoHeight;if(portrait&&land){vb.classList.add("rot");vb.style.width=innerHeight+"px";vb.style.height=innerWidth+"px"}else{vb.classList.remove("rot");vb.style.width="";vb.style.height=""}}
function fsBack(){if(FSV)toggleFs(FSV)}
function toggleFs(vb){const on=!vb.classList.contains("fs"),b=$("#fsb");
 if(on){vb.classList.add("fs");document.body.classList.add("nofs");FSV=vb;
  try{if(tg&&tg.requestFullscreen&&tg.isVersionAtLeast&&tg.isVersionAtLeast("8.0"))tg.requestFullscreen()}catch(e){}
  try{if(tg&&tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(fsBack)}}catch(e){}
  try{const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape");if(p&&p.catch)p.catch(()=>{})}catch(e){}
  setTimeout(fsLayout,350)}
 else{vb.classList.remove("fs","rot");vb.style.width=vb.style.height="";document.body.classList.remove("nofs");FSV=null;
  try{if(tg&&tg.exitFullscreen&&tg.isFullscreen)tg.exitFullscreen()}catch(e){}
  try{if(tg&&tg.BackButton){tg.BackButton.offClick(fsBack);tg.BackButton.hide()}}catch(e){}
  try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}}
 if(b)b.innerHTML=on?IC.fsx:IC.fs}
window.addEventListener("resize",()=>{if(FSV)setTimeout(fsLayout,200)});
function initPlayer(){
 const vb=$("#vb"),v=$("#pv"),ctl=$("#ctl"),big=$("#cbig"),sk=$("#sk"),ct=$("#ct"),dt=$("#dt"),mu=$("#mu"),fsb=$("#fsb"),mo=$("#mo"),pm=$("#pm");if(!vb||!v)return;
 const t=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
 let hide,seeking=false;
 const show=()=>{ctl.classList.add("show");clearTimeout(hide);if(!v.paused)hide=setTimeout(()=>ctl.classList.remove("show"),2800)};
 const upPlay=()=>{big.innerHTML=v.paused?IC.play:IC.pause;if(v.paused){ctl.classList.add("show");clearTimeout(hide)}else show()};
 const upMute=()=>{mu.innerHTML=(v.muted||v.volume===0)?IC.mute:IC.vol};
 big.onclick=e=>{e.stopPropagation();v.paused?v.play():v.pause()};
 vb.onclick=e=>{if(pm.style.display==="block"){pm.style.display="none";return}if(e.target.closest(".bar"))return;if(!ctl.classList.contains("show"))show();else v.paused?v.play():v.pause()};
 v.onplay=v.onpause=upPlay;
 v.onloadedmetadata=()=>{dt.textContent=t(v.duration);const r=v.videoWidth/v.videoHeight;if(r)vb.style.aspectRatio=Math.min(2.4,Math.max(.5625,r)).toFixed(4);if(FSV)fsLayout()};
 v.ontimeupdate=()=>{if(!seeking&&v.duration)sk.value=v.currentTime/v.duration*1000;ct.textContent=t(v.currentTime)};
 sk.oninput=()=>{seeking=true;if(v.duration)v.currentTime=sk.value/1000*v.duration;ct.textContent=t(v.currentTime)};
 sk.onchange=()=>{seeking=false;show()};
 mu.onclick=e=>{e.stopPropagation();v.muted=!v.muted;upMute()};
 fsb.onclick=e=>{e.stopPropagation();toggleFs(vb)};
 mo.innerHTML=IC.more;
 const drawM=()=>{pm.innerHTML=`<div class="pmt">Playback speed</div><div class="chips">${[.5,.75,1,1.25,1.5,2].map(r=>`<button data-r="${r}" class="${v.playbackRate===r?"on":""}">${r}×</button>`).join("")}</div><button class="pmi" data-a="loop">🔁 Loop: ${v.loop?"On":"Off"}</button>${document.pictureInPictureEnabled&&v.requestPictureInPicture?'<button class="pmi" data-a="pip">🖼️ Picture in picture</button>':""}`};
 mo.onclick=e=>{e.stopPropagation();if(pm.style.display==="block")pm.style.display="none";else{drawM();pm.style.display="block";clearTimeout(hide)}};
 pm.onclick=e=>{e.stopPropagation();const b=e.target.closest("button");if(!b)return;if(b.dataset.r){v.playbackRate=parseFloat(b.dataset.r);drawM()}else if(b.dataset.a==="loop"){v.loop=!v.loop;drawM()}else if(b.dataset.a==="pip"){v.requestPictureInPicture().catch(()=>{});pm.style.display="none"}};
 fsb.innerHTML=IC.fs;upPlay();upMute();if(v.readyState>=1)v.onloadedmetadata();
 const p=v.play();if(p&&p.catch)p.catch(()=>{});
}
function cp(l){return navigator.clipboard?navigator.clipboard.writeText(l).then(()=>true,()=>false):Promise.resolve(false)}
async function shareV(){
 const v=CUR.v,link=mkLink(v),text=v.title||"Video";
 let ok=await cp(link);
 if(!ok){try{const a=document.createElement("textarea");a.value=link;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();ok=document.execCommand("copy");a.remove()}catch(e){}}
 toast(ok?"🔗 Link copied":"Copy this link: "+link);
 setTimeout(()=>{try{if(tg&&tg.openTelegramLink)tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(text));else if(navigator.share)navigator.share({title:text,url:link}).catch(()=>{})}catch(e){}},700);
}
const dlName=t=>((String(t||"video").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g," ").replace(/ /g,"_"))||"video")+".mp4";
async function fixDl(b){if(!FB.ok||!FB.st)return toast("আগে Firebase কানেক্ট করুন");b.disabled=true;let n=0,bad=0;for(const v of videos){if(v.vpath){try{await FB.st.ref(v.vpath).updateMetadata({contentDisposition:'attachment; filename="'+dlName(v.title)+'"'});n++}catch(e){bad++}}}b.disabled=false;toast("✔ "+n+"টি ভিডিও ঠিক হয়েছে"+(bad?" ("+bad+"টি ব্যর্থ)":""))}
async function autoFixDl(){if(!FB.ok||!FB.st)return;for(const v of videos){if(v.vpath&&!v.cd){try{await FB.st.ref(v.vpath).updateMetadata({contentDisposition:'attachment; filename="'+dlName(v.title)+'"'});await FB.db.collection("videos").doc(v.id).update({cd:true});v.cd=true}catch(e){}}}}
async function dl(){
 const v=CUR.v;if((Number(unlocks[v.id])||0)<CUR.N)return toast("Unlock the video first");if(DLB.link){openUrl(DLB.link);return}
 let url=CUR.src||safeUrl(v.url);const name=dlName(v.title);
 if(tg&&tg.initData&&/^https?:/.test(url||""))return dlSheet(url,name);
 const b=$("#dlb"),old=b&&b.innerHTML;if(b){b.disabled=true;b.innerHTML='<span class="sp"></span><span>Downloading...</span>'}
 try{
  if(!url&&v.localVideo){const bl=await mget(v.id+"_video");if(bl)url=URL.createObjectURL(bl)}
  if(!url)throw 0;
  let href=url;if(/^https?:/.test(url)){try{const r=await fetch(url);if(!r.ok)throw 0;href=URL.createObjectURL(await r.blob())}catch(e){href=url}}
  const a=document.createElement("a");a.href=href;a.download=name;if(href===url)a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  bump("downloads",1);refreshStats();toast("⬇ Download started")
 }catch(e){toast("Download failed — please try again")}
 if(b){b.disabled=false;b.innerHTML=old}
}
function dlSheet(url,name){
 const d=document.createElement("div");d.className="dsh";d.innerHTML='<div class="dbox"><h3>Download video</h3><p>Choose how you want to download:</p><button class="btn" id="d1">⬇ Download in Telegram</button><button class="btn alt" id="d2">🌐 Download in browser</button><button class="sm" id="d3" style="width:100%;margin-top:10px;padding:12px">Cancel</button></div>';
 document.body.appendChild(d);const close=()=>d.remove();
 d.onclick=e=>{if(e.target===d)close()};
 $("#d3").onclick=close;
 $("#d1").onclick=()=>{close();try{tg.downloadFile({url,file_name:name},ok=>{if(ok){toast("⬇ Download started — check Telegram downloads");bump("downloads",1);refreshStats()}else toast("Download cancelled")})}catch(e){toast("Not supported in your Telegram — use Download in browser")}};
 $("#d2").onclick=()=>{close();try{tg.openLink(url);bump("downloads",1);refreshStats();toast("Opening browser...")}catch(e){window.open(url,"_blank")}};
}
/* ===== অ্যাড নেটওয়ার্ক: Monetag + Adsgram ===== */
function modeCard(){const m=AD.mode||"monetag";return `<div class="cd" data-sec="ad" style="margin-top:0"><h3>📡 কোন অ্যাড চলবে</h3><p style="font-size:12.5px">ভেরিফিকেশন ও টাস্কের অ্যাড কোন নেটওয়ার্ক থেকে আসবে বেছে নিন।</p><select id="admode">${[["monetag","শুধু Monetag"],["adsgram","শুধু Adsgram"],["both","দুটোই — পালা করে (একটা না এলে অন্যটা)"]].map(o=>`<option value="${o[0]}" ${m===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><button class="btn" onclick="saveMode()">💾 সেভ করুন</button><div class="err" id="mdmsg"></div></div>`}
function agCard(){const a=AD.ag||{};return `<div class="cd" data-sec="ad"><h3>🟣 Adsgram অ্যাড সেটআপ</h3><p style="font-size:12.5px">Adsgram (adsgram.ai) থেকে পাওয়া Block ID এখানে বসান। Adsgram শুধু টেলিগ্রামের ভেতরে চলে।</p><label>Adsgram SDK লিংক</label><input id="agsdk" value="${esc(a.sdk||"https://sad.adsgram.ai/js/sad.min.js")}"><label>Block ID</label><input id="agblock" value="${esc(a.block||"")}" placeholder="যেমন: 12345 বা int-12345"><button class="btn" onclick="connectAg(this)">🔌 Connect</button><div class="err" id="agmsg"></div><div id="agok">${a.block?`<div class="okt" style="margin-top:12px">✔ সেভ করা আছে — Block ${esc(a.block)}</div>`:""}</div></div>`}
function saveMode(){const m=$("#admode").value,msg=$("#mdmsg");msg.textContent="";if(m!=="monetag"&&!(AD.ag&&AD.ag.block)){msg.textContent="❌ আগে নিচে Adsgram Block ID বসিয়ে Connect করুন";return}AD.mode=m;LS.set("dm_ad",AD);if(FB.ok)saveSettings().catch(fbErr);if(m!=="monetag")loadAgSdk().catch(()=>{});toast("✔ সেভ হয়েছে")}
async function connectAg(b){const msg=$("#agmsg"),ok=$("#agok");msg.textContent="";ok.innerHTML="";const sdk=$("#agsdk").value.trim(),block=$("#agblock").value.trim();
 if(!/^https:\/\/./.test(sdk)){msg.textContent="❌ SDK লিংক ঠিক নয় (https:// দিয়ে শুরু হতে হবে)";return}
 if(!/^[\w-]{1,30}$/.test(block)){msg.textContent="❌ Block ID ঠিক নয় — শুধু সংখ্যা/অক্ষর/ড্যাশ দিন";return}
 const o=b.innerHTML,prev=AD.ag;b.disabled=true;b.innerHTML='<span class="sp"></span>কানেক্ট হচ্ছে...';
 try{AD.ag={sdk,block};_agc=null;await loadAgSdk();if(!agCtl())throw new Error("Adsgram চালু করা যায়নি — Block ID ঠিক আছে কি দেখুন");LS.set("dm_ad",AD);if(FB.ok)await saveSettings();ok.innerHTML=`<div class="okt" style="margin-top:12px">✔ কানেক্টেড — Block ${esc(block)}</div><button class="sm s" style="width:100%;padding:12px" onclick="testAg(this)">▶ টেস্ট অ্যাড দেখুন</button>`}
 catch(e){AD.ag=prev;_agc=null;msg.textContent="❌ "+(e.message||e)}
 b.disabled=false;b.innerHTML=o}
async function testAg(b){b.disabled=true;try{await showAdsgram();toast("✔ অ্যাড সফল")}catch(e){$("#agmsg").textContent="❌ অ্যাড চালু হয়নি: "+((e&&e.message)||e)}b.disabled=false}
/* ===== ডাউনলোড বাটন সেটিং + থাম্বনেইল অনুপাত ===== */
IC.more='<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><circle cx="12" cy="5" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="19" r="2.1"/></svg>';
const imgAR=u=>new Promise(r=>{if(!u)return r(0);const i=new Image();i.onload=()=>r(i.naturalHeight?i.naturalWidth/i.naturalHeight:0);i.onerror=()=>r(0);i.src=u});
let DLB=Object.assign({text:"Download",color:"",link:""},LS.get("dm_dlb",null)||{});
function dlbBtn(){const ok=DLB.color&&/^#[0-9a-f]{3,8}$/i.test(DLB.color);return `<button class="dlb" id="dlb" onclick="dl()" ${ok?`style="background:${DLB.color};box-shadow:0 6px 16px ${DLB.color}66"`:""}>${IC.dl}<span>${esc(DLB.text||"Download")}</span></button>`}
function dlbAdmin(){const d=DLB,on=!d.color;return `<div class="cd" data-sec="tx" style="margin-top:0"><h3>⬇ ডাউনলোড বাটন</h3><p style="font-size:12.5px">ভিডিও আনলক হওয়ার পর যে বাটনটা দেখায় তার লেখা, রং ও লিংক এখানে বদলান।</p><div class="acts" style="margin:0 0 12px">${dlbBtn()}</div><label>বাটনের লেখা</label><input id="dbt" value="${esc(d.text)}"><label>বাটনের রং</label><div style="display:flex;gap:9px;align-items:center;margin:6px 0"><input id="dbc" type="color" value="${/^#[0-9a-f]{6}$/i.test(d.color||"")?d.color:"#1263ff"}" onchange="$('#dbd').checked=false" style="width:64px;height:44px;padding:2px;margin:0;flex:none">${["#1263ff","#e0455a","#1ce6a2","#ff9f1a","#8311e7"].map(c=>`<span onclick="$('#dbc').value='${c}';$('#dbd').checked=false" style="width:32px;height:32px;border-radius:50%;background:${c};flex:none;cursor:pointer"></span>`).join("")}</div><label style="display:flex;gap:8px;align-items:center;margin:6px 0 10px"><input id="dbd" type="checkbox" ${on?"checked":""} style="width:auto;margin:0">ডিফল্ট রং (নীল-বেগুনি)</label><label>লিংক (খালি রাখলে ভিডিও ডাউনলোড হবে)</label><input id="dbl" type="url" placeholder="https://..." value="${esc(d.link)}"><button class="btn" onclick="saveDlb(this)">💾 সেভ করুন</button></div>`}
async function saveDlb(b){let l=$("#dbl").value.trim();if(l&&!/^[a-z]+:\/\//i.test(l))l="https://"+l;DLB={text:$("#dbt").value.trim()||"Download",color:$("#dbd").checked?"":$("#dbc").value,link:l};b.disabled=true;try{await saveSettings();toast("✔ সেভ হয়েছে")}catch(e){fbErr(e)}adminPanel()}
