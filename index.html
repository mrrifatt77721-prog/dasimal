function parseCfg(t){const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("কনফিগ পাওয়া যায়নি — Firebase এর firebaseConfig অংশটা পেস্ট করুন");let o;try{o=JSON.parse(m[0])}catch(e){try{o=JSON.parse(m[0].replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*\}/g,"}"))}catch(e2){throw new Error("কনফিগ পড়া যায়নি — কপি করা অংশ সঠিক আছে কি দেখুন")}}if(!o.apiKey||!o.projectId)throw new Error("apiKey বা projectId পাওয়া যায়নি");return o}
async function fbInit(cfg){if(!window.firebase){const B="https://www.gstatic.com/firebasejs/10.12.2/";await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-firestore-compat.js");await loadScript(B+"firebase-storage-compat.js")}for(const a of firebase.apps.slice())await a.delete();firebase.initializeApp(cfg);FB.db=firebase.firestore();FB.st=cfg.storageBucket?firebase.storage():null;FB.cfg=cfg}
function fbMsg(e){const m=(e&&e.message)||String(e),c=(e&&e.code)||"",x=c+" "+m;if(/permission|insufficient|unauthorized/i.test(x))return "পারমিশন নেই — Firebase Console এ Firestore ও Storage এর Rules এ read/write অনুমতি দিন।";if(/api[- ]key/i.test(x))return "API Key ভুল — কনফিগ আবার কপি করুন।";if(/not[- ]?found|does not exist/i.test(x))return "Firestore Database তৈরি করা হয়নি — Console এ Firestore Database → Create database চাপুন।";if(/network|unavailable|offline|failed to fetch/i.test(x))return "নেটওয়ার্ক সমস্যা বা Firebase পৌঁছানো যাচ্ছে না।";return m}

async function saveBanner(b){const f=$("#bimg").files[0],url=$("#burl").value.trim(),t=$("#bti").value.trim(),d=$("#bde").value.trim();let l=$("#bli").value.trim();const old=bEdit>=0?BAN[bEdit]:null;if(!f&&!url&&!(old&&old.img)&&!t)return toast("ছবি বা লেখা দিন");if(l&&!/^[a-z]+:\/\//i.test(l))l="https://"+l;const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>সেভ হচ্ছে';try{let img=url||(old&&old.img)||"",ipath=(old&&old.ipath)||"";if(f){const blob=CRS.b?await crBlob("b"):await shrink(f);if(FB.ok){const p="banners/"+Date.now()+".jpg";img=await new Promise((res,rej)=>{const k=FB.st.ref(p).put(blob);k.on("state_changed",null,rej,()=>k.snapshot.ref.getDownloadURL().then(res,rej))});if(ipath)FB.st.ref(ipath).delete().catch(()=>{});ipath=p}else{img=await readURL(blob);ipath=""}}const it={img,title:t,desc:d,link:l,ipath};if(old)BAN[bEdit]=it;else BAN.push(it);await saveSettings();bEdit=-1;toast("ব্যানার সেভ হয়েছে");adminPanel()}catch(e){fbErr(e);b.disabled=false;b.innerHTML=o}}
async function delBanner(i){if(!confirm("ব্যানার ডিলিট করবেন?"))return;const b=BAN[i];if(FB.ok&&b&&b.ipath)FB.st.ref(b.ipath).delete().catch(()=>{});BAN.splice(i,1);try{await saveSettings()}catch(e){fbErr(e)}adminPanel()}

async function connectAd(b){const msg=$("#admsg"),ok=$("#adok");msg.textContent="";ok.innerHTML="";let sdk=$("#adsdk").value.trim(),zone=$("#adzone").value.trim();const raw=$("#adraw").value;if(raw.trim()){const s=raw.match(/src=['"]([^'"]+)['"]/),z=raw.match(/data-zone=['"](\d+)['"]/);if(s)sdk=s[1];if(z)zone=z[1]}if(!/^(https?:)?\/\/./.test(sdk)){msg.textContent="❌ SDK লিংক ঠিক নয় (// বা https:// দিয়ে শুরু হতে হবে)";return}if(!/^\d{4,}$/.test(zone)){msg.textContent="❌ Zone ID শুধু সংখ্যা হতে হবে";return}const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>কানেক্ট হচ্ছে...';try{await loadAdSdk(sdk,zone);AD={sdk,zone};ZONE=zone;LS.set("dm_ad",AD);if(FB.ok)await saveSettings();$("#adsdk").value=sdk;$("#adzone").value=zone;ok.innerHTML=`<div class="okt" style="margin-top:12px">✔ কানেক্টেড — Zone ${esc(zone)}</div><button class="sm s" style="width:100%;padding:12px" onclick="testAd(this)">▶ টেস্ট অ্যাড দেখুন</button>`}catch(e){msg.textContent="❌ "+(e.message||e)}b.disabled=false;b.innerHTML=o}

function promoAdmin(){const p=PR;return `<div class="cd" data-sec="pr" style="margin-top:0"><h3>📣 নোটিশ কার্ড</h3><p style="font-size:12.5px">লিংক ছাড়া অ্যাপে ঢুকলে ইউজার এটা দেখবে। নিচে এখনকার চেহারা:</p>${promoHTML().replace('class="cd pr"','class="cd pr" style="margin:0 0 16px"')}<label class="pick">🖼️ গ্যালারি থেকে ছবি বাছুন<input id="prf" type="file" accept="image/*" onchange="crLoad(this,'pr')"></label><div class="fn" id="prfn"></div>${cropUI("pr",1.7778)}<label>অথবা ছবির URL</label><input id="pru" type="url" placeholder="https://...jpg" value="${/^https?:/.test(p.img||"")?esc(p.img):""}"><label>নোটিশ লেখা (ছবির নিচে)</label><textarea id="prn" rows="3">${esc(p.notice)}</textarea><label>বাটনের লেখা</label><input id="prbt" value="${esc(p.btnText)}"><label>বাটনের রং</label><div style="display:flex;gap:9px;align-items:center;margin:6px 0 10px"><input id="prbc" type="color" value="${/^#[0-9a-f]{6}$/i.test(p.btnColor)?p.btnColor:"#1263ff"}" style="width:64px;height:44px;padding:2px;margin:0;flex:none">${["#1263ff","#e0455a","#1ce6a2","#ff9f1a","#8311e7"].map(c=>`<span onclick="$('#prbc').value='${c}'" style="width:32px;height:32px;border-radius:50%;background:${c};flex:none;cursor:pointer"></span>`).join("")}</div><label>বাটনের লিংক (ক্লিক করলে যেখানে যাবে)</label><input id="prl" type="url" value="${esc(p.link)}"><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="prs" type="checkbox" ${p.show===false?"":"checked"} style="width:auto;margin:0">এই কার্ড দেখান</label><button class="btn" onclick="savePromo(this)">💾 সেভ করুন</button></div>`}
async function savePromo(b){const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>সেভ হচ্ছে';try{let img=PR.img,ipath=PR.ipath||"";const url=$("#pru").value.trim();if(CRS.pr){const blob=await crBlob("pr");if(FB.ok){const p="promo/"+Date.now()+".jpg";img=await new Promise((res,rej)=>{const k=FB.st.ref(p).put(blob);k.on("state_changed",null,rej,()=>k.snapshot.ref.getDownloadURL().then(res,rej))});if(ipath)FB.st.ref(ipath).delete().catch(()=>{});ipath=p}else{img=await readURL(blob);ipath=""}}else if(url&&url!==PR.img){img=url;ipath=""}let l=$("#prl").value.trim();if(l&&!/^[a-z]+:\/\//i.test(l))l="https://"+l;PR={img,ipath,notice:$("#prn").value.trim(),btnText:$("#prbt").value.trim(),btnColor:$("#prbc").value,link:l,show:$("#prs").checked};await saveSettings();toast("✔ সেভ হয়েছে");adminPanel()}catch(e){fbErr(e);b.disabled=false;b.innerHTML=o}}

function cropUI(p,a){return `<div id="${p}_box" style="display:none"><canvas id="${p}_cv" width="360" height="203" style="width:100%;border-radius:12px;background:#000"></canvas><label>✂️ ক্রপের আকার</label><select id="${p}_as" onchange="crDraw('${p}')">${CRA.map(o=>`<option value="${o[0]}" ${o[0]===String(a)?"selected":""}>${o[1]}</option>`).join("")}</select><label>জুম</label><input id="${p}_z" type="range" min="1" max="4" step="0.05" value="1" oninput="crDraw('${p}')"><label>বাম ↔ ডান</label><input id="${p}_x" type="range" min="0" max="100" value="50" oninput="crDraw('${p}')"><label>ওপর ↕ নিচ</label><input id="${p}_y" type="range" min="0" max="100" value="50" oninput="crDraw('${p}')"></div>`}
function crLoad(inp,p){const f=inp.files[0];fn(inp,p+"fn");if(!f){delete CRS[p];$("#"+p+"_box").style.display="none";return}const im=new Image();im.onload=()=>{CRS[p]=im;$("#"+p+"_box").style.display="block";crDraw(p)};im.onerror=()=>toast("ছবি পড়া যায়নি");im.src=URL.createObjectURL(f)}
function crRect(p){const im=CRS[p],a=parseFloat($("#"+p+"_as").value),z=parseFloat($("#"+p+"_z").value);let cw=Math.min(im.width,im.height*a),ch=cw/a;cw/=z;ch/=z;return{x:(im.width-cw)*$("#"+p+"_x").value/100,y:(im.height-ch)*$("#"+p+"_y").value/100,cw,ch,a}}
function crDraw(p){if(!CRS[p])return;const r=crRect(p),c=$("#"+p+"_cv");c.height=Math.round(c.width/r.a);c.getContext("2d").drawImage(CRS[p],r.x,r.y,r.cw,r.ch,0,0,c.width,c.height)}
function crBlob(p){const r=crRect(p),c=document.createElement("canvas");c.width=Math.min(900,Math.round(r.cw));c.height=Math.round(c.width/r.a);c.getContext("2d").drawImage(CRS[p],r.x,r.y,r.cw,r.ch,0,0,c.width,c.height);return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("ছবি প্রসেস করা যায়নি")),"image/jpeg",.85))}
/* ===== ভিউ / লাইক / ডাউনলোড / ফুলস্ক্রিন ===== */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);
function statsHTML(){const v=CUR.v,me=LS.get("dm_my",{})[v.id]||{},g=k=>fmt(Number(v[k])||0);return `<span class="m">👁 ${g("views")} views</span><span class="m">⬇ ${g("downloads")}</span><button class="${me.vote===1?"on":""}" onclick="vote(1)">👍 ${g("likes")}</button><button class="${me.vote===-1?"on":""}" onclick="vote(-1)">👎 ${g("dislikes")}</button>`}
function refreshStats(){const e=$("#st");if(e)e.innerHTML=statsHTML()}
async function bump(k,d){const v=CUR.v;v[k]=Math.max(0,(Number(v[k])||0)+d);if(v.cloud&&FB.db){try{await FB.db.collection("videos").doc(v.id).update({[k]:firebase.firestore.FieldValue.increment(d)})}catch(e){}}else{const L=videos.find(x=>x.id===v.id);if(L){L[k]=v[k];LS.set("dm_videos",videos)}}}
async function vote(x){const v=CUR.v,m=LS.get("dm_my",{}),me=m[v.id]||{},cur=me.vote||0,key=a=>a===1?"likes":"dislikes";if(cur===x){bump(key(x),-1);me.vote=0}else{if(cur)bump(key(cur),-1);bump(key(x),1);me.vote=x}m[v.id]=me;LS.set("dm_my",m);refreshStats()}
async function dl(){
  const v=CUR.v;if(dl.busy)return;
  if((Number(unlocks[v.id])||0)<CUR.N)return toast("Unlock the video first");
  let url=CUR.src||safeUrl(v.url);
  if(!url&&v.localVideo){const b=await mget(v.id+"_video");if(b)url=URL.createObjectURL(b)}
  if(!url)return toast("Download not available");
  const name=((v.title||"video").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_")||"video")+".mp4";
  const save=h=>{const a=document.createElement("a");a.href=h;a.download=name;a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();a.remove()};
  dl.busy=true;bump("downloads",1);refreshStats();
  try{
    if(/^(blob|data):/.test(url)){save(url);toast("⬇ Download started")}
    else if(tg&&tg.downloadFile&&tg.isVersionAtLeast&&tg.isVersionAtLeast("8.0")){tg.downloadFile({url,file_name:name});toast("⬇ Download started")}
    else{toast("⬇ Download started");const r=await fetch(url);if(!r.ok)throw new Error("http");const o=URL.createObjectURL(await r.blob());save(o);setTimeout(()=>URL.revokeObjectURL(o),120000)}
  }catch(e){
    if(tg&&tg.openLink)tg.openLink(url);else window.open(url,"_blank")
  }
  dl.busy=false;
}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function pseudoFs(b){b.classList.add("fsx");syncFs()}
function exitFs(){const b=$("#pl");if(b)b.classList.remove("fsx");const x=document.exitFullscreen||document.webkitExitFullscreen;if(fsEl()&&x){try{x.call(document)}catch(e){}}try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}syncFs()}
function syncFs(){const b=$("#pl"),f=$("#pfs");if(f)f.textContent=(fsEl()||(b&&b.classList.contains("fsx")))?"✕":"⛶"}
function goFs(){
  const b=$("#pl"),vd=$("#pv");if(!b||!vd)return;
  if(fsEl()||b.classList.contains("fsx"))return exitFs();
  const rq=b.requestFullscreen||b.webkitRequestFullscreen;
  const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}};
  if(rq){try{const p=rq.call(b);if(p&&p.then)p.then(()=>{lock();syncFs()}).catch(()=>pseudoFs(b));else{lock();syncFs()}return}catch(e){}}
  if(vd.webkitEnterFullscreen){try{vd.webkitEnterFullscreen();return}catch(e){}}
  pseudoFs(b);
}
document.addEventListener("fullscreenchange",()=>{if(!fsEl())try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}syncFs()});
document.addEventListener("webkitfullscreenchange",syncFs);
const mmss=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
function initPlayer(){
  const b=$("#pl"),vd=$("#pv");if(!b||!vd)return;
  const big=$("#pbig"),tm=$("#ptime"),sk=$("#pseek"),mt=$("#pmute"),fs=$("#pfs");let ht,seeking=false;
  const upd=()=>{if(!seeking&&vd.duration)sk.value=vd.currentTime/vd.duration*1000;tm.textContent=mmss(vd.currentTime)+" / "+mmss(vd.duration)};
  const sync=()=>{big.textContent=vd.paused?"▶":"❚❚";b.classList.toggle("paused",vd.paused)};
  const show=()=>{b.classList.add("ui");clearTimeout(ht);if(!vd.paused)ht=setTimeout(()=>b.classList.remove("ui"),2800)};
  const toggle=()=>{if(vd.paused){const p=vd.play();if(p&&p.catch)p.catch(()=>{})}else vd.pause()};
  ["timeupdate","loadedmetadata","durationchange"].forEach(e=>vd.addEventListener(e,upd));
  ["play","pause","ended"].forEach(e=>vd.addEventListener(e,()=>{sync();show()}));
  big.onclick=()=>{toggle();show()};
  mt.onclick=()=>{vd.muted=!vd.muted;mt.textContent=vd.muted?"🔇":"🔊";show()};
  fs.onclick=()=>{goFs();show()};
  sk.addEventListener("input",()=>{seeking=true;if(vd.duration)vd.currentTime=sk.value/1000*vd.duration;show()});
  sk.addEventListener("change",()=>{seeking=false});
  b.addEventListener("click",e=>{if(e.target.closest("button,input"))return;if(b.classList.contains("ui")&&!vd.paused){b.classList.remove("ui")}else show()});
  sync();upd();show();
}
window.addEventListener("hashchange",init);init();
