  if(v.localVideo){try{const b=await mget(v.id+"_video");if(!b)return shell(`<div class="cd c"><h2>Video file not found</h2></div>`);src=URL.createObjectURL(b)}catch(e){return toast("Could not load video")}}
  shell(`<div class="cd" style="margin-top:0"><video controls autoplay playsinline src="${src}"></video><div style="margin-top:12px"><span class="badge">✔ Unlocked</span></div><h2>${esc(v.title)}</h2><p>${esc(v.desc)}</p></div>`,"▶ Playing");
}

async function addVideo(b){
  const title=$("#vt").value.trim(),url=safeUrl($("#vu").value.trim()),vf=$("#vvf").files[0],tf=$("#vtf").files[0];
  const old=editId?videos.find(x=>x.id===editId):null;

const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=()=>rej(new Error("Firebase SDK লোড হয়নি — ইন্টারনেট বা হোস্টিং পরিবেশ পরীক্ষা করুন (চ্যাটের প্রিভিউতে Firebase ব্লক থাকে)"));document.head.appendChild(s)});
function parseCfg(t){const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("কনফিগ পাওয়া যায়নি — Firebase এর firebaseConfig অংশটা পেস্ট করুন");let o;try{o=JSON.parse(m[0])}catch(e){try{o=JSON.parse(m[0].replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*\}/g,"}"))}catch(e2){throw new Error("কনফিগ পড়া যায়নি — কপি করা অংশ সঠিক আছে কি দেখুন")}}if(!o.apiKey||!o.projectId)throw new Error("apiKey বা projectId পাওয়া যায়নি");return o}
async function fbInit(cfg){if(!window.firebase){const B="https://www.gstatic.com/firebasejs/10.12.2/";await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-firestore-compat.js");await loadScript(B+"firebase-storage-compat.js")}for(const a of firebase.apps.slice())await a.delete();firebase.initializeApp(cfg);FB.db=firebase.firestore();FB.st=cfg.storageBucket?firebase.storage():null;FB.cfg=cfg}
function fbMsg(e){const m=(e&&e.message)||String(e),c=(e&&e.code)||"",x=c+" "+m;if(/permission|insufficient|unauthorized/i.test(x))return "পারমিশন নেই — Firebase Console এ Firestore ও Storage এর Rules এ read/write অনুমতি দিন।";if(/api[- ]key/i.test(x))return "API Key ভুল — কনফিগ আবার কপি করুন।";if(/not[- ]?found|does not exist/i.test(x))return "Firestore Database তৈরি করা হয়নি — Console এ Firestore Database → Create database চাপুন।";if(/network|unavailable|offline|failed to fetch/i.test(x))return "নেটওয়ার্ক সমস্যা বা Firebase পৌঁছানো যাচ্ছে না।";return m}

function fbCard(){return `<div class="cd" data-sec="fb" style="margin-top:0"><h3>🔥 Firebase কানেকশন</h3>${FB.ok?`<div class="okt">✔ কানেক্টেড — ${esc(FB.cfg.projectId)}</div>`:`<p style="font-size:12.5px">Firebase Console → Project settings → Your apps → Config থেকে <b>firebaseConfig</b> অংশটা এখানে পেস্ট করুন।</p>`}<textarea id="fbcfg" rows="5" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", appId: "..." }'>${FB.cfg?esc(JSON.stringify(FB.cfg,null,1)):""}</textarea><button class="btn" onclick="connectFb(this)">${FB.ok?"🔄 আবার Connect":"🔌 Connect"}</button>${FB.ok?`<button class="sm" style="width:100%;margin-top:8px;padding:12px" onclick="fbOff()">Disconnect</button>`:""}<div class="err" id="fbmsg">${!FB.ok&&FB.err?"❌ "+esc(FB.err):""}</div>${miniBox()}<details style="margin-top:10px"><summary style="font-size:13px;color:#9db4e9">⚙️ Firebase সেটআপ গাইড</summary><p style="font-size:12.5px">1) Firestore Database তৈরি করুন, 2) Storage চালু করুন, 3) দুটিরই Rules এ নিচের মতো দিন:</p><pre>// Firestore\nrules_version = '2';\nservice cloud.firestore {\n match /databases/{d}/documents {\n  match /{col}/{id} { allow read, write: if true; }\n }\n}\n\n// Storage\nrules_version = '2';\nservice firebase.storage {\n match /b/{b}/o {\n  match /{all=**} { allow read, write: if true; }\n }\n}</pre><p style="font-size:11.5px">⚠️ write খোলা থাকলে যেকেউ লিখতে পারে—পরে Firebase Auth যোগ করা উচিত।</p></details></div>`}
async function connectFb(b){const msg=$("#fbmsg");msg.className="err";msg.textContent="";const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>কানেক্ট হচ্ছে...';try{const cfg=parseCfg($("#fbcfg").value);if(!cfg.storageBucket)throw new Error("storageBucket পাওয়া যায়নি — গ্যালারির ভিডিও আপলোডের জন্য কনফিগে storageBucket থাকতে হবে");await fbInit(cfg);await Promise.race([FB.db.collection("videos").limit(1).get(),new Promise((_,r)=>setTimeout(()=>r(new Error("সময় শেষ — ইন্টারনেট বা Firestore Database তৈরি হয়েছে কি দেখুন")),12000))]);FB.ok=true;FB.err="";LS.set("dm_fb",cfg);await fbSync();await loadSettings().catch(()=>{});toast("✔ Firebase কানেক্টেড");adminPanel()}catch(e){FB.ok=false;msg.textContent="❌ "+fbMsg(e);b.disabled=false;b.innerHTML=o}}

let BAN=LS.get("dm_banners",[]);if(!Array.isArray(BAN))BAN=[];
let bEdit=-1,ADM_TAB="vid";
const G=["linear-gradient(115deg,#08bfe9,#0647cf,#8311e7)","linear-gradient(115deg,#ff7a18,#af002d,#8311e7)","linear-gradient(115deg,#11998e,#38ef7d,#0647cf)"];
const cssu=u=>String(u).replace(/['"()\s\\]/g,c=>encodeURIComponent(c));
async function saveSettings(){if(FB.ok)await FB.db.collection("settings").doc("app").set({banners:BAN,texts:TX,ad:AD,mini:MINI});else{LS.set("dm_banners",BAN);LS.set("dm_tx",TX);LS.set("dm_ad",AD);LS.set("dm_mini",MINI)}}
async function loadSettings(){const d=await FB.db.collection("settings").doc("app").get();if(d.exists){const x=d.data();BAN=x.banners||[];TX=x.texts||{};if(x.ad&&x.ad.zone){AD=x.ad;applyAd()}if(x.mini!==undefined)MINI=x.mini}}
let _boot;const bootCloud=()=>_boot||(_boot=(async()=>{const fb=new URLSearchParams(location.search).get("fb");if(!fb||FB.db)return;try{let s=fb.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);const cfg=JSON.parse(decodeURIComponent(escape(atob(s))));await Promise.race([(async()=>{await fbInit(cfg);await loadSettings()})(),new Promise(r=>setTimeout(r,8000))])}catch(e){}})());
const showBan=p=>SES.ok&&location.hash!=="#admin"&&["● ONLINE","🔒 Locked","✔ Done"].includes(p)?bannerHTML():"";
function bannerHTML(){if(!BAN.length)return "";return `<div class="bn" id="bn">${BAN.map((b,i)=>`<div class="bs" ${b.link?`onclick="goLink(${i})"`:""} style="${b.img?`background-image:linear-gradient(90deg,rgba(6,17,43,.85),rgba(6,17,43,.1)),url('${cssu(b.img)}')`:`background:${G[i%3]}`}"><div class="bt"><b>${esc(b.title)}</b><p>${esc(b.desc)}</p>${b.link?'<span class="go">Open ›</span>':""}</div></div>`).join("")}</div>${BAN.length>1?`<div class="bd">${BAN.map(()=>"<i></i>").join("")}</div>`:""}`}
function startBn(){clearInterval(window._bt);const el=$("#bn");if(!el||BAN.length<2)return;let i=0;const dots=()=>{const k=Math.round(el.scrollLeft/el.clientWidth);document.querySelectorAll(".bd i").forEach((d,j)=>d.className=j===k?"on":"")};el.onscroll=dots;dots();window._bt=setInterval(()=>{i=(Math.round(el.scrollLeft/el.clientWidth)+1)%BAN.length;el.scrollTo({left:el.clientWidth*i,behavior:"smooth"})},4000)}
function goLink(i){const u=BAN[i]&&BAN[i].link;if(!/^https?:\/\//i.test(u||""))return;if(tg&&/^https:\/\/t\.me\//i.test(u)&&tg.openTelegramLink)tg.openTelegramLink(u);else if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank")}
const shrink=f=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const w=Math.min(900,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error("ছবি প্রসেস করা যায়নি")),"image/jpeg",.8)};im.onerror=()=>rej(new Error("ছবি পড়া যায়নি"));im.src=URL.createObjectURL(f)});
function bannerAdmin(){const e=bEdit>=0?BAN[bEdit]:null;return `<div class="cd" data-sec="ban" style="margin-top:0"><h3>${e?"✏️ ব্যানার এডিট":"🖼️ নতুন ব্যানার"}</h3><label class="pick">🖼️ গ্যালারি থেকে ব্যানার ছবি বাছুন<input id="bimg" type="file" accept="image/*" onchange="fn(this,'bfn')"></label><div class="fn" id="bfn"></div><label>অথবা ছবির URL</label><input id="burl" type="url" placeholder="https://...jpg" value="${e&&/^https?:/.test(e.img||"")?esc(e.img):""}"><label>টাইটেল (ব্যানারের লেখা)</label><input id="bti" value="${e?esc(e.title):""}"><label>ছোট বর্ণনা</label><input id="bde" value="${e?esc(e.desc):""}"><label>লিংক (ক্লিক করলে যেখানে যাবে)</label><input id="bli" type="url" placeholder="https://t.me/..." value="${e?esc(e.link||""):""}"><button class="btn" onclick="saveBanner(this)">${e?"💾 আপডেট":"➕ ব্যানার যোগ করুন"}</button>${e?`<button class="sm" style="width:100%;margin-top:8px;padding:12px" onclick="bEdit=-1;adminPanel()">বাতিল</button>`:""}<h3 style="margin-top:20px">ব্যানার তালিকা (${BAN.length})</h3>${BAN.map((b,i)=>`<div class="it"><div class="vt" style="${b.img?`background-image:url('${cssu(b.img)}')`:`background:${G[i%3]}`}"></div><div class="n">${esc(b.title||"(লেখা নেই)")}</div><div class="bt"><button class="sm" onclick="bEdit=${i};adminPanel()">এডিট</button><button class="sm r" onclick="delBanner(${i})">ডিলিট</button></div></div>`).join("")||'<p>এখনো কোনো ব্যানার নেই — ডিফল্ট ব্যানার দেখাবে।</p>'}</div>`}
async function saveBanner(b){const f=$("#bimg").files[0],url=$("#burl").value.trim(),t=$("#bti").value.trim(),d=$("#bde").value.trim();let l=$("#bli").value.trim();const old=bEdit>=0?BAN[bEdit]:null;if(!f&&!url&&!(old&&old.img)&&!t)return toast("ছবি বা লেখা দিন");if(l&&!/^[a-z]+:\/\//i.test(l))l="https://"+l;const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>সেভ হচ্ছে';try{let img=url||(old&&old.img)||"",ipath=(old&&old.ipath)||"";if(f){const blob=await shrink(f);if(FB.ok){const p="banners/"+Date.now()+".jpg";img=await new Promise((res,rej)=>{const k=FB.st.ref(p).put(blob);k.on("state_changed",null,rej,()=>k.snapshot.ref.getDownloadURL().then(res,rej))});if(ipath)FB.st.ref(ipath).delete().catch(()=>{});ipath=p}else{img=await readURL(blob);ipath=""}}const it={img,title:t,desc:d,link:l,ipath};if(old)BAN[bEdit]=it;else BAN.push(it);await saveSettings();bEdit=-1;toast("ব্যানার সেভ হয়েছে");adminPanel()}catch(e){fbErr(e);b.disabled=false;b.innerHTML=o}}
async function delBanner(i){if(!confirm("ব্যানার ডিলিট করবেন?"))return;const b=BAN[i];if(FB.ok&&b&&b.ipath)FB.st.ref(b.ipath).delete().catch(()=>{});BAN.splice(i,1);try{await saveSettings()}catch(e){fbErr(e)}adminPanel()}
const TB=[["vid","🎬 ভিডিও"],["ban","🖼️ ব্যানার"],["ad","📢 অ্যাড"],["fb","🔥 কানেক্ট"],["tx","✏️ লেখা"]];
const tabBar=()=>`<div class="tabs">${TB.map(t=>`<button class="${ADM_TAB===t[0]?"on":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</div>`;
function setTab(t){ADM_TAB=t;document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("on",TB[i][0]===t));applyTab()}
function applyTab(){document.querySelectorAll("[data-sec]").forEach(e=>e.classList.toggle("hid",e.dataset.sec!==ADM_TAB))}
const _stx=saveTx,_ev=editVideo;
saveTx=function(){_stx();if(FB.ok)saveSettings().catch(fbErr)};
editVideo=function(id){ADM_TAB="vid";_ev(id)};
/* ===== Monetag অ্যাড সেটআপ ===== */
let AD=LS.get("dm_ad",null)||{sdk:"//libtl.com/sdk.js",zone:"12261981"};
function loadAdSdk(sdk,zone){return new Promise((res,rej)=>{const fn="show_"+zone;if(typeof window[fn]==="function")return res();const old=document.getElementById("monetag-dyn");if(old)old.remove();const s=document.createElement("script");s.id="monetag-dyn";s.src=sdk;s.async=true;s.dataset.zone=zone;s.dataset.sdk=fn;s.onerror=()=>rej(new Error("SDK লোড হয়নি — লিংক ঠিক আছে কি দেখুন বা অ্যাডব্লকার বন্ধ করুন (চ্যাটের প্রিভিউতে বাইরের স্ক্রিপ্ট ব্লক থাকে)"));s.onload=()=>{let n=0;const t=setInterval(()=>{if(typeof window[fn]==="function"){clearInterval(t);res()}else if(++n>25){clearInterval(t);rej(new Error("SDK লোড হয়েছে কিন্তু Zone ID ("+zone+") দিয়ে অ্যাড ফাংশন পাওয়া যায়নি — Zone ID ঠিক আছে কি দেখুন"))}},200)};document.head.appendChild(s)})}
function applyAd(){if(!AD||!AD.zone)return;ZONE=AD.zone;if(AD.zone!=="12261981"||AD.sdk!=="//libtl.com/sdk.js")loadAdSdk(AD.sdk,AD.zone).catch(()=>{})}
function adCard(){return `<div class="cd" data-sec="ad" style="margin-top:0"><h3>📢 Monetag অ্যাড সেটআপ</h3><p style="font-size:12.5px">Monetag থেকে পাওয়া Telegram Mini App SDK ও Zone ID এখানে বসান। নতুন Monetag অ্যাকাউন্ট বা নতুন Mini App হলে এখানে বদলালেই হবে।</p><label>Telegram SDK লিংক (script src)</label><input id="adsdk" value="${esc(AD.sdk)}" placeholder="//libtl.com/sdk.js"><label>Zone ID</label><input id="adzone" value="${esc(AD.zone)}" inputmode="numeric" placeholder="12261981"><label>অথবা পুরো স্ক্রিপ্ট কোড এখানে পেস্ট করুন</label><textarea id="adraw" rows="2" placeholder="<script src='//libtl.com/sdk.js' data-zone='...' data-sdk='show_...'><\/script>"></textarea><button class="btn" onclick="connectAd(this)">🔌 Connect</button><div class="err" id="admsg"></div><div id="adok"></div>${FB.ok?"":'<p style="font-size:11.5px;margin-top:10px">ℹ️ Firebase কানেক্ট না থাকলে এই সেটিং শুধু এই ডিভাইসে থাকবে।</p>'}</div>`}
async function connectAd(b){const msg=$("#admsg"),ok=$("#adok");msg.textContent="";ok.innerHTML="";let sdk=$("#adsdk").value.trim(),zone=$("#adzone").value.trim();const raw=$("#adraw").value;if(raw.trim()){const s=raw.match(/src=['"]([^'"]+)['"]/),z=raw.match(/data-zone=['"](\d+)['"]/);if(s)sdk=s[1];if(z)zone=z[1]}if(!/^(https?:)?\/\/./.test(sdk)){msg.textContent="❌ SDK লিংক ঠিক নয় (// বা https:// দিয়ে শুরু হতে হবে)";return}if(!/^\d{4,}$/.test(zone)){msg.textContent="❌ Zone ID শুধু সংখ্যা হতে হবে";return}const o=b.innerHTML;b.disabled=true;b.innerHTML='<span class="sp"></span>কানেক্ট হচ্ছে...';try{await loadAdSdk(sdk,zone);AD={sdk,zone};ZONE=zone;LS.set("dm_ad",AD);if(FB.ok)await saveSettings();$("#adsdk").value=sdk;$("#adzone").value=zone;ok.innerHTML=`<div class="okt" style="margin-top:12px">✔ কানেক্টেড — Zone ${esc(zone)}</div><button class="sm s" style="width:100%;padding:12px" onclick="testAd(this)">▶ টেস্ট অ্যাড দেখুন</button>`}catch(e){msg.textContent="❌ "+(e.message||e)}b.disabled=false;b.innerHTML=o}
async function testAd(b){b.disabled=true;try{const r=await window["show_"+ZONE]();toast("✔ অ্যাড সফল"+(r&&r.reward_event_type?" ("+r.reward_event_type+")":""))}catch(e){$("#admsg").textContent="❌ অ্যাড চালু হয়নি: "+((e&&e.message)||(typeof e==="string"?e:"অজানা সমস্যা"))}b.disabled=false}
/* ===== Telegram Mini App লিংক ===== */
let MINI=LS.get("dm_mini","")||"";
function miniBox(){const u=FB.ok?`${location.origin}${location.pathname}?fb=${fbEnc()}`:"";window._miniUrl=u;return `<div style="margin-top:16px;border-top:1px solid #26365c;padding-top:12px"><b>📲 Telegram Mini App সেটআপ</b><label>Mini App Direct Link (BotFather থেকে পাওয়া)</label><input id="mini" value="${esc(MINI)}" placeholder="https://t.me/YourBot/app"><button class="sm s" style="width:100%;padding:12px" onclick="saveMini()">সেভ করুন</button>${u?`<label style="margin-top:12px">BotFather এ Mini App এর URL হিসেবে এটা দিন:</label><input readonly value="${esc(u)}" onclick="this.select()"><button class="sm" style="width:100%;padding:12px" onclick="copyText(_miniUrl)">📋 URL কপি করুন</button>`:`<p style="font-size:12px">Firebase কানেক্ট হলে এখানে BotFather এর জন্য URL দেখাবে।</p>`}</div>`}
function saveMini(){MINI=$("#mini").value.trim().replace(/\?.*$/,"").replace(/\/+$/,"");LS.set("dm_mini",MINI);if(FB.ok)saveSettings().catch(fbErr);toast("সেভ হয়েছে")}
window.addEventListener("hashchange",init);init();
</script>
</body>
</html>
